<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ant Design Vue Playground</title>
  <link rel="stylesheet" href="static/css/antd.min.css">
  <link rel="stylesheet" href="static/css/element-ui.min.css">
  <link rel="stylesheet" href="static/css/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/splitpanes@3.1.5/dist/splitpanes.min.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      overflow: hidden;
    }
    #app-container {
      height: 100vh;
    }
    .splitpanes {
      height: 100%;
    }
    .splitpanes__pane {
      overflow: hidden;
      height: 100% !important;
      width: 100% !important;
    }
    .splitpanes__splitter {
      background-color: #ccc;
      position: relative;
    }
    .splitpanes__splitter::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #999;
    }
    /* 移动端 SplitPane 样式适配 */
    @media (max-width: 767px) {
      .splitpanes--vertical > .splitpanes__splitter {
        height: 8px !important;
      }
      .splitpanes--horizontal > .splitpanes__splitter {
        width: 8px !important;
      }
      #editorPane,
      .splitpanes__pane:first-child {
        height: 50vh !important;
        min-height: 200px !important;
      }
      #codemirror-container {
        height: 100% !important;
        width: 100% !important;
        min-height: 200px;
      }
      .btn-group {
        gap: 8px !important;
      }
      .btn-group .btn-item {
        width: 32px !important;
        height: 32px !important;
      }
    }
    #code {
      display: none;
    }
    /* 按钮组容器 - 固定在右下角 */
    .btn-group {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    /* 刷新提示按钮 */
    .run {
      padding: 6px 12px;
      color: #fff;
      background-color: #52c41a;
      border-radius: 6px;
      cursor: default;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    /* 通用圆形按钮样式 */
    .btn-item {
      width: 36px;
      height: 36px;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    /* 切换编辑器按钮 */
    .editor-switch {
      background-color: #1890ff;
    }
    .editor-switch:hover {
      background-color: #40a9ff;
      transform: scale(1.05);
    }
    /* 全屏按钮 */
    .fullscreen-btn {
      background: #1890ff;
    }
    .fullscreen-btn:hover {
      background: #40a9ff;
      transform: scale(1.05);
    }
    /* 退出全屏按钮 - 固定在右下角 */
    .exit-fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      width: 36px;
      height: 36px;
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    .exit-fullscreen-btn:hover {
      background: #ff7875;
      transform: scale(1.05);
    }
    /* CodeMirror 核心样式修复 */
    .CodeMirror {
      font-family: consolas;
      font-size: 14px;
      height: 100% !important;
      width: 100% !important;
      min-height: 200px;
    }
    .CodeMirror-scroll {
      height: 100% !important;
    }
    .CodeMirror-gutter,
    .CodeMirror-gutters {
      min-height: 100% !important;
    }
    #monaco-editor-container {
      width: 100%;
      height: 100%;
      display: none;
      min-height: 200px;
    }
    .preview-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 998;
      background: white;
    }
    .icon {
      font-size: 16px;
    }
    .preview-area {
      height: 100%;
      overflow: auto;
    }
    .fallback-splitter {
      width: 8px;
      height: 100%;
      background-color: #ccc;
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fallback-splitter-vertical {
      width: 100%;
      height: 8px;
      cursor: row-resize;
    }
    .fallback-splitter::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #999;
    }
    .loading-tip {
      position: fixed;
      bottom: 80px;
      right: 20px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-container"></div>
  
  <textarea id="code"><template>
  <div class="page">
    <a-button type="primary" @click="visible = true">按钮</a-button>
    <el-button type="primary" @click="visible = true">按钮</el-button>
    <el-date-picker placeholder="请选择日期(ElementUI)" v-model="date" style="margin: 0 10px;" />
    
    <a-date-picker 
      placeholder="基础日期选择(AntD)" 
      v-model="antdDate" 
      style="margin: 0 10px;"
      @change="handleDateChange"
    />
    <a-date-picker 
      placeholder="带快捷选项" 
      v-model="antdDate2" 
      style="margin: 0 10px;"
      :disabled-date="disabledDate"
      :preset-ranges="presetRanges"
    />
    <a-range-picker 
      placeholder="日期范围选择" 
      v-model="dateRange" 
      style="margin: 0 10px;"
    />
    <a-date-picker 
      placeholder="月份选择器" 
      v-model="monthDate" 
      style="margin: 0 10px;"
      picker="month"
    />
    
    <a-modal v-model:visible="visible" title="Hello world">
      <p>Try Ant Design Vue</p>
      <div>已选日期: {{ antdDate ? antdDate.format('YYYY-MM-DD') : '未选择' }}</div>
    </a-modal>
  </div>
</template>

<script>
export default {
  data() {
    return {
      date: null,
      antdDate: null,
      antdDate2: null,
      dateRange: null,
      monthDate: null,
      visible: false,
      presetRanges: {
        '今天': [moment(), moment()],
        '昨天': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
        '近7天': [moment().subtract(6, 'days'), moment()],
        '近30天': [moment().subtract(29, 'days'), moment()]
      }
    }
  },
  methods: {
    handleDateChange(date, dateString) {
      console.log('选中日期:', date, '日期字符串:', dateString);
    },
    disabledDate(current) {
      return current && current > moment().endOf('day');
    }
  }
}
</script>

<style>
.page {
  padding: 20px;
}
.ant-picker {
  margin-bottom: 10px;
}
</style></textarea>

  <!-- 按钮组容器 - 固定在右下角 -->
  <div class="btn-group">
    <span class="run">✓ 自动刷新中</span>
    <div class="editor-switch btn-item" id="editorSwitchBtn">
      <i class="fas fa-edit icon"></i>
    </div>
    <button class="fullscreen-btn btn-item" id="fullscreenBtn">
      <i class="fas fa-expand icon"></i>
    </button>
  </div>
  
  <div class="loading-tip" id="loadingTip">正在加载 Monaco Editor...</div>

  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/locale/zh-cn.js"></script>
  <script src="static/js/vue.js"></script>
  <script src="static/js/vue-template-compiler.js"></script>
  <script src="static/js/antd.min.js"></script>
  <script src="static/js/element-ui.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/splitpanes@3.1.5/dist/splitpanes.umd.js"></script>
  
  <script src="static/codemirror/codemirror.js"></script>
  <script src="static/codemirror/overlay.js"></script>
  <script src="static/codemirror/matchbrackets.js"></script>
  <script src="static/codemirror/closebrackets.js"></script>
  <script src="static/codemirror/closetag.js"></script>
  <script src="static/codemirror/xml.js"></script>
  <script src="static/codemirror/javascript.js"></script>
  <script src="static/codemirror/css.js"></script>
  <script src="static/codemirror/htmlmixed.js"></script>
  <script src="static/codemirror/vue.js"></script>

  <script>
    let editor = null;
    let isMonacoLoaded = false;
    let monacoEditor = null;
    let currentEditorType = 'codemirror';
    let debounceTimeout;
    let isFullscreen = false;
    let currentLayout = 'horizontal';
    let splitPaneInstance = null;
    let isSplitPanesAvailable = false;
    let isMonacoLoading = false;
    let splitPanesRetryCount = 0;
    const MAX_SPLITPANES_RETRIES = 3;
    const SPLITPANES_RETRY_DELAY = 1000;
    let initialCode = '';
    
    const loadingTip = document.getElementById('loadingTip');
    const editorSwitchBtn = document.getElementById('editorSwitchBtn');
    
    function checkSplitPanesAvailabilityWithRetry() {
      return new Promise((resolve) => {
        const check = () => {
          try {
            isSplitPanesAvailable = typeof window.splitpanes !== 'undefined';
            
            if (isSplitPanesAvailable) {
              console.log('SplitPanes加载成功');
              resolve(true);
              return;
            }
            
            splitPanesRetryCount++;
            if (splitPanesRetryCount < MAX_SPLITPANES_RETRIES) {
              console.log(`SplitPanes加载失败，${SPLITPANES_RETRY_DELAY}ms后重试 (${splitPanesRetryCount}/${MAX_SPLITPANES_RETRIES})`);
              setTimeout(check, SPLITPANES_RETRY_DELAY);
            } else {
              console.warn('SplitPanes重试次数用尽，使用原生分割面板');
              resolve(false);
            }
          } catch (e) {
            splitPanesRetryCount++;
            if (splitPanesRetryCount < MAX_SPLITPANES_RETRIES) {
              setTimeout(check, SPLITPANES_RETRY_DELAY);
            } else {
              resolve(false);
            }
          }
        };
        
        check();
      });
    }
    
    function initFallbackSplitPane() {
      const container = document.getElementById('app-container');
      const isMobile = window.innerWidth <= 767;
      currentLayout = isMobile ? 'vertical' : 'horizontal';
      
      container.innerHTML = `
        <div style="display: ${isMobile ? 'flex; flex-direction: column;' : 'flex;'}; height: 100%; width: 100%;">
          <div style="${isMobile ? 'height: 50vh; min-height: 200px;' : 'width: 50%;'}" id="editorPane">
            <div id="monaco-editor-container"></div>
            <div id="codemirror-container"></div>
          </div>
          <div class="fallback-splitter ${isMobile ? 'fallback-splitter-vertical' : ''}" id="fallback-splitter"></div>
          <div style="${isMobile ? 'flex: 1;' : 'flex: 1;'}">
            <div id="app" class="preview-area"></div>
          </div>
        </div>
      `;
      
      const splitter = document.getElementById('fallback-splitter');
      const editorPane = document.getElementById('editorPane');
      let isDragging = false;
      let startX, startY, startWidth, startHeight;
      
      splitter.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        startWidth = editorPane.offsetWidth;
        startHeight = editorPane.offsetHeight;
        
        document.addEventListener('mousemove', handleDrag);
        document.addEventListener('mouseup', stopDrag);
        
        e.preventDefault();
      });
      
      function handleDrag(e) {
        if (!isDragging) return;
        
        const container = document.getElementById('app-container');
        
        if (currentLayout === 'horizontal') {
          const deltaX = e.clientX - startX;
          const newWidth = startWidth + deltaX;
          const containerWidth = container.offsetWidth;
          
          if (newWidth > 100 && newWidth < containerWidth - 100) {
            editorPane.style.width = `${newWidth}px`;
          }
        } else {
          const deltaY = e.clientY - startY;
          const newHeight = startHeight + deltaY;
          const containerHeight = container.offsetHeight;
          
          if (newHeight > 200 && newHeight < containerHeight - 100) {
            editorPane.style.height = `${newHeight}px`;
          }
        }
        
        if (editor && editor instanceof CodeMirror) {
          editor.refresh();
        }
        if (monacoEditor) {
          monacoEditor.layout();
        }
      }
      
      function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', handleDrag);
        document.removeEventListener('mouseup', stopDrag);
      }
      
      window.addEventListener('resize', debounce(function() {
        const newLayout = window.innerWidth <= 767 ? 'vertical' : 'horizontal';
        if (newLayout !== currentLayout) {
          currentLayout = newLayout;
          initFallbackSplitPane();
          if (currentEditorType === 'monaco' && isMonacoLoaded) {
            initMonacoEditor();
          } else {
            initCodeMirror();
          }
          run();
        } else {
          if (editor && editor instanceof CodeMirror) {
            editor.refresh();
          }
          if (monacoEditor) {
            monacoEditor.layout();
          }
        }
      }, 300));
    }
    
    async function initSplitPane() {
      const splitPanesLoaded = await checkSplitPanesAvailabilityWithRetry();
      
      if (!splitPanesLoaded) {
        initFallbackSplitPane();
        return;
      }
      
      const container = document.getElementById('app-container');
      const isMobile = window.innerWidth <= 767;
      currentLayout = isMobile ? 'vertical' : 'horizontal';
      
      container.innerHTML = `
        <div class="splitpanes ${isMobile ? 'splitpanes--vertical' : 'splitpanes--horizontal'}">
          <div class="splitpanes__pane" ${isMobile ? 'style="height: 50vh; min-height: 200px;"' : 'style="width: 50%;"'}>
            <div id="monaco-editor-container"></div>
            <div id="codemirror-container"></div>
          </div>
          <div class="splitpanes__splitter"></div>
          <div class="splitpanes__pane">
            <div id="app" class="preview-area"></div>
          </div>
        </div>
      `;
      
      try {
        splitPaneInstance = new window.splitpanes.Splitpanes(document.querySelector('.splitpanes'), {
          resizerThickness: isMobile ? 8 : 8,
          cursor: isMobile ? 'row-resize' : 'col-resize'
        });
        
        splitPaneInstance.on('resize', () => {
          if (editor && editor instanceof CodeMirror) {
            editor.refresh();
          }
          if (monacoEditor) {
            monacoEditor.layout();
          }
        });
      } catch (error) {
        console.error('初始化SplitPanes失败:', error);
        initFallbackSplitPane();
        return;
      }
      
      window.addEventListener('resize', debounce(function() {
        const newLayout = window.innerWidth <= 767 ? 'vertical' : 'horizontal';
        if (newLayout !== currentLayout) {
          currentLayout = newLayout;
          initSplitPane();
          if (currentEditorType === 'monaco' && isMonacoLoaded) {
            initMonacoEditor();
          } else {
            initCodeMirror();
          }
          run();
        } else {
          if (editor && editor instanceof CodeMirror) {
            editor.refresh();
          }
          if (monacoEditor) {
            monacoEditor.layout();
          }
        }
      }, 300));
    }
    
    function debounce(func, wait) {
      let timeout;
      return function() {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, arguments), wait);
      };
    }
    
    function initCodeMirror() {
      console.log('初始化CodeMirror编辑器');
      
      const codeMirrorContainer = document.getElementById('codemirror-container');
      const monacoContainer = document.getElementById('monaco-editor-container');
      
      if (!codeMirrorContainer) {
        console.error('CodeMirror初始化失败：codemirror-container不存在');
        return;
      }
      
      if (currentEditorType === 'codemirror' && editor && editor instanceof CodeMirror) {
        editor.refresh();
        console.log('CodeMirror已初始化，仅刷新尺寸');
        return;
      }
      
      let currentContent = getEditorContent() || initialCode;
      
      if (monacoEditor) {
        monacoEditor.dispose();
        monacoEditor = null;
      }
      
      codeMirrorContainer.style.display = 'block';
      if (monacoContainer) monacoContainer.style.display = 'none';
      
      if (editor && editor.toTextArea) {
        editor.toTextArea();
        editor = null;
      }
      
      codeMirrorContainer.innerHTML = '';
      
      const tempTextarea = document.createElement('textarea');
      tempTextarea.id = 'temp-code-' + Date.now();
      tempTextarea.value = currentContent;
      codeMirrorContainer.appendChild(tempTextarea);
      
      editor = CodeMirror.fromTextArea(tempTextarea, {
        lineNumbers: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        autoCloseTags: true,
        mode: { name: 'vue' },
        theme: 'default',
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        touchEvents: true,
        scrollbarStyle: 'native'
      });
      
      if (currentContent) {
        editor.setValue(currentContent);
      }
      
      editor.off('change', handleEditorChange);
      editor.on('change', handleEditorChange);
      
      setTimeout(() => {
        editor.refresh();
      }, 100);
      
      currentEditorType = 'codemirror';
      
      console.log('CodeMirror初始化完成');
    }
    
    function loadMonacoEditor() {
      return new Promise((resolve, reject) => {
        if (isMonacoLoading) {
          const checkLoading = setInterval(() => {
            if (window.monaco) {
              clearInterval(checkLoading);
              isMonacoLoaded = true;
              resolve(true);
            } else if (!isMonacoLoading) {
              clearInterval(checkLoading);
              reject(new Error('Monaco加载被取消'));
            }
          }, 100);
          return;
        }
        
        if (window.monaco) {
          isMonacoLoaded = true;
          resolve(true);
          return;
        }
        
        loadingTip.style.display = 'block';
        isMonacoLoading = true;
        
        const script = document.createElement('script');
        script.src = 'https://cdn.bootcdn.net/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js';
        script.async = true;
        
        script.onload = () => {
          window.require.config({ paths: { 'vs': 'https://cdn.bootcdn.net/ajax/libs/monaco-editor/0.47.0/min/vs' } });
          
          window.require(['vs/editor/editor.main'], () => {
            isMonacoLoaded = true;
            isMonacoLoading = false;
            loadingTip.style.display = 'none';
            resolve(true);
          }, (err) => {
            isMonacoLoading = false;
            loadingTip.style.display = 'none';
            reject(err);
          });
        };
        
        script.onerror = (err) => {
          isMonacoLoading = false;
          loadingTip.style.display = 'none';
          reject(err);
        };
        
        document.head.appendChild(script);
      });
    }
    
    function initMonacoEditor() {
      if (currentEditorType === 'monaco' && monacoEditor) {
        monacoEditor.layout();
        return;
      }
      
      const container = document.getElementById('monaco-editor-container');
      const codeMirrorContainer = document.getElementById('codemirror-container');
      const codeTextarea = document.getElementById('code');
      
      if (!container) return;
      
      let currentContent = getEditorContent();
      
      container.style.display = 'block';
      if (codeMirrorContainer) codeMirrorContainer.style.display = 'none';
      
      if (monacoEditor) {
        monacoEditor.dispose();
      }
      
      try {
        monacoEditor = monaco.editor.create(container, {
          value: currentContent || codeTextarea.value,
          language: 'vue',
          theme: 'vs-light',
          minimap: { enabled: true },
          scrollBeyondLastLine: false,
          fontSize: 14,
          lineNumbers: 'on',
          autoClosingBrackets: 'always',
          autoClosingTags: 'always',
          matchBrackets: 'always'
        });
        
        monacoEditor.onDidChangeModelContent(handleEditorChange);
        
        window.addEventListener('resize', () => {
          if (monacoEditor) {
            monacoEditor.layout();
          }
        });
        
        editor = monacoEditor;
        
        currentEditorType = 'monaco';
        
      } catch (error) {
        console.error('初始化Monaco Editor失败:', error);
        initCodeMirror();
      }
    }
    
    async function switchEditor() {
      if (currentEditorType === 'codemirror') {
        try {
          await loadMonacoEditor();
          initMonacoEditor();
        } catch (error) {
          console.error('切换到Monaco Editor失败:', error);
          alert('加载Monaco Editor失败，请检查网络或稍后再试');
        }
      } else {
        initCodeMirror();
      }
    }
    
    function getEditorContent() {
      try {
        if (currentEditorType === 'monaco' && isMonacoLoaded && monacoEditor) {
          return monacoEditor.getValue();
        } else if (editor && editor.getValue) {
          return editor.getValue();
        }
        return document.getElementById('code').value || '';
      } catch (e) {
        console.error('获取编辑器内容失败:', e);
        return '';
      }
    }
    
    function handleEditorChange() {
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        run();
      }, 500);
    }
    
    function run() {
      const app = document.getElementById('app');
      if (!app) return;
      
      const codeContent = getEditorContent();
      
      try {
        const compiler = VueTemplateCompiler.parseComponent(codeContent);
        const option = new Function(
          compiler.script.content.replace('export default', 'return')
        )();
        option.template = compiler.template.content;

        window.moment = moment;
        moment.locale('zh-cn');
        Vue.use(antd);

        const vueStyle = document.getElementById('vue-style');
        if (vueStyle) {
          document.head.removeChild(vueStyle);
        }
        if (compiler.styles[0]) {
          const style = document.createElement('style');
          style.id = 'vue-style';
          style.innerHTML = compiler.styles[0].content;
          document.head.appendChild(style);
        }

        const component = new Vue(option).$mount();
        app.innerHTML = '';
        app.appendChild(component.$el);
      } catch (error) {
        console.error('代码运行出错:', error);
        app.innerHTML = `<div style="padding: 20px; color: red;">代码运行出错: ${error.message}</div>`;
      }
    }
    
    function toggleFullscreen() {
      const app = document.getElementById('app');
      if (!app) return;
      
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const btnGroup = document.querySelector('.btn-group');
      
      if (!isFullscreen) {
        app.classList.add('preview-fullscreen');
        btnGroup.style.display = 'none';
        
        // 创建退出全屏按钮，固定在右下角
        const exitBtn = document.createElement('button');
        exitBtn.className = 'exit-fullscreen-btn';
        exitBtn.id = 'exitFullscreenBtn';
        exitBtn.innerHTML = '<i class="fas fa-compress icon"></i>';
        document.body.appendChild(exitBtn);
        exitBtn.addEventListener('click', toggleFullscreen);
      } else {
        app.classList.remove('preview-fullscreen');
        btnGroup.style.display = 'flex';
        
        const exitBtn = document.getElementById('exitFullscreenBtn');
        if (exitBtn) {
          document.body.removeChild(exitBtn);
        }
      }
      isFullscreen = !isFullscreen;
    }
    
    async function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      
      if (url) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const content = await response.text();
            if (currentEditorType === 'monaco' && isMonacoLoaded && monacoEditor) {
              monacoEditor.setValue(content);
            } else if (editor && editor.setValue) {
              editor.setValue(content);
            } else {
              document.getElementById('code').value = content;
            }
            setTimeout(() => run(), 100);
          } else {
            console.error('加载文件失败:', response.status);
          }
        } catch (error) {
          console.error('加载文件出错:', error);
        }
      }
    }
    
    async function init() {
      console.log('开始初始化应用');
      
      const codeTextarea = document.getElementById('code');
      if (codeTextarea && !initialCode) {
        initialCode = codeTextarea.value;
        console.log('初始代码已保存');
      }
      
      await initSplitPane();
      
      initCodeMirror();
      
      if (editorSwitchBtn) {
        editorSwitchBtn.addEventListener('click', switchEditor);
      }
      
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', toggleFullscreen);
      }
      
      await loadFromUrl();
      
      run();
      
      console.log('应用初始化完成');
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
