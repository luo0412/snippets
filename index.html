<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ant Design Vue Playground</title>
  <link rel="stylesheet" href="static/css/antd.min.css">
  <link rel="stylesheet" href="static/css/element-ui.min.css">
  <link rel="stylesheet" href="static/css/codemirror.css">
  <link rel="stylesheet" href="static/css/font-awesome.min.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      overflow: hidden;
      touch-action: pan-y;
    }
    #app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* PC端水平布局 */
    @media (min-width: 768px) {
      #app-container {
        flex-direction: row;
      }
      #editorPane {
        width: 50%;
        min-width: 200px;
        max-width: 80%;
      }
      #previewPane {
        flex: 1;
        min-width: 200px;
      }
    }
    /* 移动端垂直布局 */
    @media (max-width: 767px) {
      #editorPane {
        height: 50%;
        min-height: 120px;
        max-height: 80%;
      }
      #previewPane {
        flex: 1;
        min-height: 120px;
      }
      /* 移动端分割条更易触摸 */
      .splitter {
        height: 12px;
        cursor: row-resize;
      }
      .splitter::after {
        width: 32px;
        height: 32px;
      }
    }
    #editorPane, #previewPane {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 分割条 */
    .splitter {
      flex-shrink: 0;
      background-color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: row-resize;
    }
    .splitter:hover {
      background-color: #1890ff;
    }
    /* PC水平分割条 */
    @media (min-width: 768px) {
      .splitter {
        width: 6px;
        cursor: col-resize;
      }
    }
    /* 移动端垂直分割条 */
    @media (max-width: 767px) {
      .splitter {
        height: 12px;
        cursor: row-resize;
      }
      .splitter::after {
        width: 32px;
        height: 32px;
      }
    }
    .splitter::after {
      content: '';
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #ccc;
      transition: background-color 0.2s;
    }
    .splitter:hover::after {
      background-color: #fff;
    }
    /* CodeMirror 滚动优化 - 支持触摸滑动 */
    #codemirror-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #codemirror-container .CodeMirror {
      height: 100% !important;
      width: 100% !important;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 14px;
      touch-action: none;
    }
    #codemirror-container .CodeMirror-scroll {
      height: 100% !important;
      overflow-y: auto !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y pinch-zoom;
    }
    #codemirror-container .CodeMirror-vscrollbar,
    #codemirror-container .CodeMirror-hscrollbar {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Monaco 编辑器容器 */
    #monaco-editor-container {
      flex: 1;
      display: none;
      overflow: hidden;
    }
    /* 预览区域 */
    .preview-area {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    #code {
      display: none;
    }
    /* 按钮组容器 */
    .btn-group {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .btn-group > * {
      height: 36px;
    }
    .run {
      padding: 0 12px;
      color: #fff;
      background-color: #52c41a;
      border-radius: 6px;
      cursor: default;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .btn-item {
      width: 36px;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    .editor-switch {
      background-color: #1890ff;
    }
    .editor-switch:hover {
      background-color: #40a9ff;
      transform: scale(1.05);
    }
    .fullscreen-btn {
      background: #1890ff;
    }
    .fullscreen-btn:hover {
      background: #40a9ff;
      transform: scale(1.05);
    }
    .exit-fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      width: 36px;
      height: 36px;
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    .exit-fullscreen-btn:hover {
      background: #ff7875;
      transform: scale(1.05);
    }
    .icon {
      font-size: 16px;
    }
    .loading-tip {
      position: fixed;
      bottom: 80px;
      right: 20px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      z-index: 999;
      display: none;
    }
    /* 全屏预览 */
    .preview-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 998;
      background: white;
    }
    /* 移动端适配 */
    @media (max-width: 767px) {
      .btn-group {
        gap: 6px;
        bottom: 12px;
        right: 12px;
      }
      .btn-group > * {
        height: 32px;
      }
      .btn-item {
        width: 32px;
      }
      .run {
        font-size: 11px;
        padding: 0 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="editorPane">
      <div id="monaco-editor-container"></div>
      <div id="codemirror-container"></div>
    </div>
    <div class="splitter" id="splitter"></div>
    <div id="previewPane">
      <div id="app" class="preview-area"></div>
    </div>
  </div>

  <textarea id="code"><template>
  <div class="page">
    <a-button type="primary" @click="visible = true">按钮</a-button>
    <el-button type="primary" @click="visible = true">按钮</el-button>
    <el-date-picker placeholder="请选择日期(ElementUI)" v-model="date" style="margin: 0 10px;" />

    <a-date-picker
      placeholder="基础日期选择(AntD)"
      v-model="antdDate"
      style="margin: 0 10px;"
      @change="handleDateChange"
    />
    <a-date-picker
      placeholder="带快捷选项"
      v-model="antdDate2"
      style="margin: 0 10px;"
      :disabled-date="disabledDate"
      :preset-ranges="presetRanges"
    />
    <a-range-picker
      placeholder="日期范围选择"
      v-model="dateRange"
      style="margin: 0 10px;"
    />
    <a-date-picker
      placeholder="月份选择器"
      v-model="monthDate"
      style="margin: 0 10px;"
      picker="month"
    />

    <a-modal v-model:visible="visible" title="Hello world">
      <p>Try Ant Design Vue</p>
      <div>已选日期: {{ antdDate ? antdDate.format('YYYY-MM-DD') : '未选择' }}</div>
    </a-modal>
  </div>
</template>

<script>
export default {
  data() {
    return {
      date: null,
      antdDate: null,
      antdDate2: null,
      dateRange: null,
      monthDate: null,
      visible: false,
      presetRanges: {
        '今天': [moment(), moment()],
        '昨天': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
        '近7天': [moment().subtract(6, 'days'), moment()],
        '近30天': [moment().subtract(29, 'days'), moment()]
      }
    }
  },
  methods: {
    handleDateChange(date, dateString) {
      console.log('选中日期:', date, '日期字符串:', dateString);
    },
    disabledDate(current) {
      return current && current > moment().endOf('day');
    }
  }
}
</script>

<style>
.page {
  padding: 20px;
}
.ant-picker {
  margin-bottom: 10px;
}
</style></textarea>

  <!-- 按钮组容器 -->
  <div class="btn-group">
    <span class="run">✓ 自动刷新中</span>
    <div class="editor-switch btn-item" id="editorSwitchBtn">
      <i class="fas fa-edit icon"></i>
    </div>
    <button class="fullscreen-btn btn-item" id="fullscreenBtn">
      <i class="fas fa-expand icon"></i>
    </button>
  </div>

  <div class="loading-tip" id="loadingTip">正在加载 Monaco Editor...</div>

  <script src="static/js/moment.min.js"></script>
  <script src="static/js/moment.zh-cn.js"></script>
  <script src="static/js/vue.js"></script>
  <script src="static/js/vue-template-compiler.js"></script>
  <script src="static/js/antd.min.js"></script>
  <script src="static/js/element-ui.min.js"></script>

  <script src="static/codemirror/codemirror.js"></script>
  <script src="static/codemirror/overlay.js"></script>
  <script src="static/codemirror/matchbrackets.js"></script>
  <script src="static/codemirror/closebrackets.js"></script>
  <script src="static/codemirror/closetag.js"></script>
  <script src="static/codemirror/xml.js"></script>
  <script src="static/codemirror/javascript.js"></script>
  <script src="static/codemirror/css.js"></script>
  <script src="static/codemirror/htmlmixed.js"></script>
  <script src="static/codemirror/vue.js"></script>

  <script>
    let editor = null;
    let isMonacoLoaded = false;
    let isMonacoLoading = false;
    let monacoEditor = null;
    let currentEditorType = 'codemirror';
    let debounceTimeout;
    let isFullscreen = false;
    let initialCode = '';
    let isDragging = false;
    let startPos = 0;
    let startSize = 0;
    let containerSize = 0;

    const loadingTip = document.getElementById('loadingTip');
    const editorSwitchBtn = document.getElementById('editorSwitchBtn');

    function initSplitPane() {
      const container = document.getElementById('app-container');
      const isMobile = window.innerWidth <= 767;

      // 设置初始分割位置
      const editorPane = document.getElementById('editorPane');
      if (isMobile) {
        editorPane.style.height = '50%';
      } else {
        editorPane.style.width = '50%';
      }

      setupSplitter();
      setupResizeListener();
    }

    function setupSplitter() {
      const splitter = document.getElementById('splitter');
      const editorPane = document.getElementById('editorPane');
      const isMobile = window.innerWidth <= 767;

      // 鼠标事件
      splitter.addEventListener('mousedown', startDrag);

      // 触摸事件 - 支持移动端
      splitter.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        e.preventDefault();
        isDragging = true;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isMobile) {
          startPos = clientY;
          startSize = editorPane.offsetHeight;
          containerSize = document.getElementById('app-container').offsetHeight;
        } else {
          startPos = clientX;
          startSize = editorPane.offsetWidth;
          containerSize = document.getElementById('app-container').offsetWidth;
        }

        document.addEventListener('mousemove', handleDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', handleDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);

        splitter.style.backgroundColor = '#1890ff';
      }

      function handleDrag(e) {
        if (!isDragging) return;
        e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isMobile) {
          const deltaY = clientY - startPos;
          const newHeight = Math.max(150, Math.min(startSize + deltaY, containerSize - 150));
          editorPane.style.height = newHeight + 'px';
        } else {
          const deltaX = clientX - startPos;
          const newWidth = Math.max(200, Math.min(startSize + deltaX, containerSize - 200));
          editorPane.style.width = newWidth + 'px';
        }

        // 刷新编辑器尺寸
        refreshEditor();
      }

      function stopDrag() {
        isDragging = false;
        splitter.style.backgroundColor = '#e8e8e8';

        document.removeEventListener('mousemove', handleDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', handleDrag);
        document.removeEventListener('touchend', stopDrag);
      }
    }

    function setupResizeListener() {
      window.addEventListener('resize', debounce(function() {
        refreshEditor();
      }, 300));
    }

    function refreshEditor() {
      if (editor && editor instanceof CodeMirror) {
        editor.refresh();
      }
      if (monacoEditor) {
        monacoEditor.layout();
      }
    }

    function debounce(func, wait) {
      let timeout;
      return function() {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, arguments), wait);
      };
    }

    function initCodeMirror() {
      console.log('初始化CodeMirror编辑器');

      const codeMirrorContainer = document.getElementById('codemirror-container');
      const monacoContainer = document.getElementById('monaco-editor-container');

      if (!codeMirrorContainer) {
        console.error('CodeMirror初始化失败：codemirror-container不存在');
        return;
      }

      if (currentEditorType === 'codemirror' && editor && editor instanceof CodeMirror) {
        editor.refresh();
        console.log('CodeMirror已初始化，仅刷新尺寸');
        return;
      }

      let currentContent = getEditorContent() || initialCode;

      if (monacoEditor) {
        monacoEditor.dispose();
        monacoEditor = null;
      }

      codeMirrorContainer.style.display = 'block';
      if (monacoContainer) monacoContainer.style.display = 'none';

      if (editor && editor.toTextArea) {
        editor.toTextArea();
        editor = null;
      }

      codeMirrorContainer.innerHTML = '';

      const tempTextarea = document.createElement('textarea');
      tempTextarea.id = 'temp-code-' + Date.now();
      tempTextarea.value = currentContent;
      codeMirrorContainer.appendChild(tempTextarea);

      editor = CodeMirror.fromTextArea(tempTextarea, {
        lineNumbers: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        autoCloseTags: true,
        mode: { name: 'vue' },
        theme: 'default',
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        scrollbarStyle: 'native'
      });

      // 优化触摸滚动
      const scrollContainer = codeMirrorContainer.querySelector('.CodeMirror-scroll');
      if (scrollContainer) {
        scrollContainer.style.touchAction = 'pan-y pinch-zoom';
      }

      if (currentContent) {
        editor.setValue(currentContent);
      }

      editor.off('change', handleEditorChange);
      editor.on('change', handleEditorChange);

      setTimeout(() => {
        editor.refresh();
      }, 100);

      currentEditorType = 'codemirror';

      console.log('CodeMirror初始化完成');
    }

    function loadMonacoEditor() {
      return new Promise((resolve, reject) => {
        if (isMonacoLoading) {
          const checkLoading = setInterval(() => {
            if (window.monaco) {
              clearInterval(checkLoading);
              isMonacoLoaded = true;
              resolve(true);
            }
          }, 100);
          return;
        }

        if (window.monaco) {
          isMonacoLoaded = true;
          resolve(true);
          return;
        }

        loadingTip.style.display = 'block';
        isMonacoLoading = true;

        const script = document.createElement('script');
        script.src = 'static/monaco/min/vs/loader.js';
        script.async = true;

        script.onload = () => {
          window.require.config({ paths: { 'vs': 'static/monaco/min/vs' } });

          window.require(['vs/editor/editor.main'], () => {
            isMonacoLoaded = true;
            isMonacoLoading = false;
            loadingTip.style.display = 'none';
            resolve(true);
          }, (err) => {
            isMonacoLoading = false;
            loadingTip.style.display = 'none';
            reject(err);
          });
        };

        script.onerror = (err) => {
          isMonacoLoading = false;
          loadingTip.style.display = 'none';
          reject(err);
        };

        document.head.appendChild(script);
      });
    }

    function initMonacoEditor() {
      if (currentEditorType === 'monaco' && monacoEditor) {
        monacoEditor.layout();
        return;
      }

      const container = document.getElementById('monaco-editor-container');
      const codeMirrorContainer = document.getElementById('codemirror-container');
      const codeTextarea = document.getElementById('code');

      if (!container) return;

      let currentContent = getEditorContent();

      container.style.display = 'block';
      if (codeMirrorContainer) codeMirrorContainer.style.display = 'none';

      if (monacoEditor) {
        monacoEditor.dispose();
      }

      try {
        monacoEditor = monaco.editor.create(container, {
          value: currentContent || codeTextarea.value,
          language: 'html',
          theme: 'vs-light',
          minimap: { enabled: true },
          scrollBeyondLastLine: false,
          fontSize: 14,
          lineNumbers: 'on',
          autoClosingBrackets: 'always',
          autoClosingTags: 'always',
          matchBrackets: 'always'
        });

        monacoEditor.onDidChangeModelContent(handleEditorChange);

        editor = monacoEditor;

        currentEditorType = 'monaco';

      } catch (error) {
        console.error('初始化Monaco Editor失败:', error);
        initCodeMirror();
      }
    }

    async function switchEditor() {
      if (currentEditorType === 'codemirror') {
        try {
          await loadMonacoEditor();
          initMonacoEditor();
        } catch (error) {
          console.error('切换到Monaco Editor失败:', error);
          alert('加载Monaco Editor失败，请检查网络或稍后再试');
        }
      } else {
        initCodeMirror();
      }
    }

    function getEditorContent() {
      try {
        if (currentEditorType === 'monaco' && isMonacoLoaded && monacoEditor) {
          return monacoEditor.getValue();
        } else if (editor && editor.getValue) {
          return editor.getValue();
        }
        return document.getElementById('code').value || '';
      } catch (e) {
        console.error('获取编辑器内容失败:', e);
        return '';
      }
    }

    function handleEditorChange() {
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        run();
      }, 500);
    }

    function run() {
      const app = document.getElementById('app');
      if (!app) return;

      const codeContent = getEditorContent();

      try {
        const compiler = VueTemplateCompiler.parseComponent(codeContent);
        const option = new Function(
          compiler.script.content.replace('export default', 'return')
        )();
        option.template = compiler.template.content;

        window.moment = moment;
        moment.locale('zh-cn');
        Vue.use(antd);

        const vueStyle = document.getElementById('vue-style');
        if (vueStyle) {
          document.head.removeChild(vueStyle);
        }
        if (compiler.styles[0]) {
          const style = document.createElement('style');
          style.id = 'vue-style';
          style.innerHTML = compiler.styles[0].content;
          document.head.appendChild(style);
        }

        const component = new Vue(option).$mount();
        app.innerHTML = '';
        app.appendChild(component.$el);
      } catch (error) {
        console.error('代码运行出错:', error);
        app.innerHTML = `<div style="padding: 20px; color: red;">代码运行出错: ${error.message}</div>`;
      }
    }

    function toggleFullscreen() {
      const app = document.getElementById('app');
      const editorPane = document.getElementById('editorPane');
      const splitter = document.getElementById('splitter');
      const btnGroup = document.querySelector('.btn-group');

      if (!isFullscreen) {
        // 进入全屏：隐藏编辑器，显示预览区全屏
        editorPane.style.display = 'none';
        splitter.style.display = 'none';
        const previewPane = document.getElementById('previewPane');
        previewPane.style.width = '100%';
        previewPane.style.height = '100%';
        previewPane.classList.add('preview-fullscreen');
        btnGroup.style.display = 'none';

        const exitBtn = document.createElement('button');
        exitBtn.className = 'exit-fullscreen-btn';
        exitBtn.id = 'exitFullscreenBtn';
        exitBtn.innerHTML = '<i class="fas fa-compress icon"></i>';
        document.body.appendChild(exitBtn);
        exitBtn.addEventListener('click', toggleFullscreen);
      } else {
        // 退出全屏：恢复编辑器显示
        editorPane.style.display = 'flex';
        splitter.style.display = 'flex';
        const previewPane = document.getElementById('previewPane');
        previewPane.classList.remove('preview-fullscreen');
        previewPane.style.width = '';
        previewPane.style.height = '';
        btnGroup.style.display = 'flex';

        const exitBtn = document.getElementById('exitFullscreenBtn');
        if (exitBtn) {
          document.body.removeChild(exitBtn);
        }

        refreshEditor();
      }
      isFullscreen = !isFullscreen;
    }

    async function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      const fullscreenParam = params.get('isFullscreen');

      // 处理 isFullscreen 参数
      if (fullscreenParam && (fullscreenParam === '1' || fullscreenParam.toLowerCase() === 'true')) {
        setTimeout(() => {
          toggleFullscreen();
        }, 100);
      }

      if (url) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const content = await response.text();
            if (currentEditorType === 'monaco' && isMonacoLoaded && monacoEditor) {
              monacoEditor.setValue(content);
            } else if (editor && editor.setValue) {
              editor.setValue(content);
            } else {
              document.getElementById('code').value = content;
            }
            setTimeout(() => run(), 100);
          } else {
            console.error('加载文件失败:', response.status);
          }
        } catch (error) {
          console.error('加载文件出错:', error);
        }
      }
    }

    async function init() {
      console.log('开始初始化应用');

      const codeTextarea = document.getElementById('code');
      if (codeTextarea && !initialCode) {
        initialCode = codeTextarea.value;
        console.log('初始代码已保存');
      }

      initSplitPane();
      initCodeMirror();

      if (editorSwitchBtn) {
        editorSwitchBtn.addEventListener('click', switchEditor);
      }

      const fullscreenBtn = document.getElementById('fullscreenBtn');
      if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', toggleFullscreen);
      }

      await loadFromUrl();

      run();

      console.log('应用初始化完成');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
