<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ant Design Vue Playground</title>
  <link rel="stylesheet" href="static/css/antd.min.css">
  <link rel="stylesheet" href="static/css/element-ui.min.css">
  <link rel="stylesheet" href="static/css/codemirror.css">
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      display: flex;
      /* 移动端改为垂直排列 */
      flex-direction: column;
    }
    /* 适配PC端 */
    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }
      .code-area {
        width: 50%;
        resize: horizontal;
        overflow: hidden;
        flex-shrink: 0;
        border-right: 1px solid #ccc;
        height: 100vh;
      }
      .preview-area {
        flex: 1;
        overflow: auto;
        height: 100vh;
      }
    }
    /* 移动端样式 */
    @media (max-width: 767px) {
      .code-area {
        width: 100%;
        height: 50vh;
        border-bottom: 1px solid #ccc;
      }
      .preview-area {
        width: 100%;
        flex: 1;
        overflow: auto;
      }
    }
    #code {
      display: none;
    }
    .run {
      position: fixed;
      top: 0;
      /* 适配移动端位置 */
      right: 20px;
      padding: 3px 10px;
      color: #fff;
      background-color: #52c41a;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      z-index: 2;
      cursor: default;
      font-size: 12px;
    }
    /* PC端调整run按钮位置 */
    @media (min-width: 768px) {
      .run {
        right: calc(50% + 20px);
      }
    }
    .CodeMirror {
      font-family: consolas;
      font-size: 14px;
      height: 100%;
    }
    /* 优化全屏按钮样式 - 贴边小图标 */
    .fullscreen-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 999;
      width: 36px;
      height: 36px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    .fullscreen-btn:hover {
      background: #40a9ff;
      transform: scale(1.05);
    }
    /* 全屏状态样式 */
    .preview-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 998;
      background: white;
    }
    /* 优化退出全屏按钮样式 - 贴边小图标 */
    .exit-fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 999;
      width: 36px;
      height: 36px;
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
    .exit-fullscreen-btn:hover {
      background: #ff7875;
      transform: scale(1.05);
    }
    /* 图标样式 */
    .icon {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="code-area">
    <textarea id="code"><template>
  <div class="page">
    <a-button type="primary" @click="visible = true">按钮</a-button>
    <el-button type="primary" @click="visible = true">按钮</el-button>
    <el-date-picker placeholder="请选择日期(ElementUI)" v-model="date" style="margin: 0 10px;" />
    
    <!-- 丰富的a-date-picker示例 -->
    <a-date-picker 
      placeholder="基础日期选择(AntD)" 
      v-model="antdDate" 
      style="margin: 0 10px;"
      @change="handleDateChange"
    />
    <a-date-picker 
      placeholder="带快捷选项" 
      v-model="antdDate2" 
      style="margin: 0 10px;"
      :disabled-date="disabledDate"
      :preset-ranges="presetRanges"
    />
    <a-range-picker 
      placeholder="日期范围选择" 
      v-model="dateRange" 
      style="margin: 0 10px;"
    />
    <a-date-picker 
      placeholder="月份选择器" 
      v-model="monthDate" 
      style="margin: 0 10px;"
      picker="month"
    />
    
    <a-modal v-model:visible="visible" title="Hello world">
      <p>Try Ant Design Vue</p>
      <div>已选日期: {{ antdDate ? antdDate.format('YYYY-MM-DD') : '未选择' }}</div>
    </a-modal>
  </div>
</template>

<script>
export default {
  data() {
    return {
      date: null,
      antdDate: null,
      antdDate2: null,
      dateRange: null,
      monthDate: null,
      visible: false,
      // 快捷日期范围
      presetRanges: {
        '今天': [moment(), moment()],
        '昨天': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
        '近7天': [moment().subtract(6, 'days'), moment()],
        '近30天': [moment().subtract(29, 'days'), moment()]
      }
    }
  },
  methods: {
    // 日期变更回调
    handleDateChange(date, dateString) {
      console.log('选中日期:', date, '日期字符串:', dateString);
    },
    // 禁用日期
    disabledDate(current) {
      // 禁用未来日期
      return current && current > moment().endOf('day');
    }
  }
}
</script>

<style>
.page {
  padding: 20px;
}
/* 调整日期选择器间距 */
.ant-picker {
  margin-bottom: 10px;
}
</style></textarea>
  </div>
  <span class="run">✓ 自动刷新中</span>
  <div id="app" class="preview-area"></div>
  
  <!-- 优化后的全屏按钮（图标样式） -->
  <button class="fullscreen-btn" id="fullscreenBtn">
    <i class="fas fa-expand icon"></i>
  </button>
  
  <!-- 引入moment.js -->
  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/locale/zh-cn.js"></script>
  
  <script src="static/js/vue.js"></script>
  <script src="static/js/vue-template-compiler.js"></script>
  <script src="static/js/antd.min.js"></script>
  <script src="static/js/element-ui.min.js"></script>
  <script src="static/codemirror/codemirror.js"></script>
  <script src="static/codemirror/overlay.js"></script>
  <script src="static/codemirror/matchbrackets.js"></script>
  <script src="static/codemirror/closebrackets.js"></script>
  <script src="static/codemirror/closetag.js"></script>
  <script src="static/codemirror/xml.js"></script>
  <script src="static/codemirror/javascript.js"></script>
  <script src="static/codemirror/css.js"></script>
  <script src="static/codemirror/htmlmixed.js"></script>
  <script src="static/codemirror/vue.js"></script>
  <script>
    const code = document.getElementById('code')
    const app = document.getElementById('app')
    const fullscreenBtn = document.getElementById('fullscreenBtn')
    const editor = CodeMirror.fromTextArea(code, {
      lineNumbers: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      autoCloseTags: true,
      mode: { name: 'vue' }
    })

    let debounceTimeout;
    let isFullscreen = false;
    
    function run() {
      const compiler = VueTemplateCompiler.parseComponent(editor.getValue())

      const option = new Function(
        compiler.script.content.replace('export default', 'return')
      )()
      option.template = compiler.template.content

      // 配置moment并注册Antd
      window.moment = moment;
      moment.locale('zh-cn'); // 设置中文
      
      // 正确注册Ant Design Vue
      Vue.use(antd)

      const vueStyle = document.getElementById('vue-style')
      if (vueStyle) document.getElementsByTagName('head')[0].removeChild(vueStyle)
      if (compiler.styles[0]) {
        const style = document.createElement('style')
        style.id = 'vue-style'
        style.innerHTML = compiler.styles[0].content
        document.getElementsByTagName('head')[0].appendChild(style)
      }

      const component = new Vue(option).$mount()
      app.innerHTML = ''
      app.appendChild(component.$el)
    }

    // 防抖函数：当编辑器内容变化时，延迟 500ms 执行
    editor.on('change', function() {
      clearTimeout(debounceTimeout)
      debounceTimeout = setTimeout(function() {
        run()
      }, 500)
    })

    // 从URL参数加载Vue文件
    async function loadFromUrl() {
      const params = new URLSearchParams(window.location.search)
      const url = params.get('url')
      
      if (url) {
        try {
          const response = await fetch(url)
          if (response.ok) {
            const content = await response.text()
            editor.setValue(content)
            // 加载后立即运行
            setTimeout(() => run(), 100)
          } else {
            console.error('Failed to load file:', response.status)
            run()
          }
        } catch (error) {
          console.error('Error loading file:', error)
          run()
        }
      } else {
        // 初始化 - 页面加载时执行一次
        run()
      }
    }

    // 全屏功能实现
    function toggleFullscreen() {
      if (!isFullscreen) {
        // 进入全屏
        app.classList.add('preview-fullscreen')
        fullscreenBtn.style.display = 'none'
        
        // 创建退出全屏按钮（图标样式）
        const exitBtn = document.createElement('button')
        exitBtn.className = 'exit-fullscreen-btn'
        exitBtn.id = 'exitFullscreenBtn'
        exitBtn.innerHTML = '<i class="fas fa-compress icon"></i>'
        document.body.appendChild(exitBtn)
        
        // 绑定退出全屏事件
        exitBtn.addEventListener('click', toggleFullscreen)
      } else {
        // 退出全屏
        app.classList.remove('preview-fullscreen')
        fullscreenBtn.style.display = 'flex'
        
        // 移除退出全屏按钮
        const exitBtn = document.getElementById('exitFullscreenBtn')
        if (exitBtn) {
          document.body.removeChild(exitBtn)
        }
      }
      isFullscreen = !isFullscreen
    }

    // 绑定全屏按钮事件
    fullscreenBtn.addEventListener('click', toggleFullscreen)

    // 初始化
    loadFromUrl()
  </script>
</body>
</html>
