<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React + Antd CDN</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/dayjs/dayjs.min.js"></script>
    <script src="https://unpkg.com/antd/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd/dist/reset.css">

    <style>
        body { padding: 50px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { Button, App, Space, Typography } = antd;

        const MyApp = () => {
            const [count, setCount] = React.useState(0);

            return (
                <Space direction="vertical" align="center">
                    <Typography.Title level={3}>Ant Design + React CDN</Typography.Title>
                    <Button 
                        type="primary" 
                        size="large" 
                        onClick={() => setCount(count + 1)}
                    >
                        Clicked {count} times
                    </Button>
                </Space>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MyApp />);
    </script>

</body>
</html>
