<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue2 Antd Playground - GLM鞭策版</title>
  <!-- 基础样式 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .playground-container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e8e8e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header h2 {
      color: #333;
      font-size: 24px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ant-btn {
      margin-right: 0;
    }
    .tips {
      background: #f0f9ff;
      border-left: 4px solid #1890ff;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 14px;
      color: #555;
    }
    .tips code {
      background: #e6f7ff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #1890ff;
    }
    /* vue-code-view 自定义样式 */
    .vue-code-view {
      border-radius: 8px;
      overflow: hidden;
    }
    .vue-code-view .code-editor {
      border-radius: 8px 0 0 8px;
    }
    .vue-code-view .preview {
      border-radius: 0 8px 8px 0;
    }
  </style>

  <!-- CDN 依赖引入（严格按顺序） -->
  <!-- Vue 2.6.14 完整版（包含编译器） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <!-- ant-design-vue 1.7.8 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ant-design-vue@1.7.8/dist/antd.min.css">
  <!-- ant-design-vue 1.7.8 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/ant-design-vue@1.7.8/dist/antd.min.js"></script>
  <!-- Ace 编辑器核心 -->
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/ace.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/ext-language_tools.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/mode-html.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/mode-javascript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/mode-css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/mode-vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/theme-monokai.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/theme-one_dark.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.4.12/src-min-noconflict/theme-github.js"></script>
  <!-- vue-code-view 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/vue-code-view@0.6.1/dist/vue-code-view.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vue-code-view@0.6.1/dist/vue-code-view.min.css">
</head>
<body>
  <div id="app" class="playground-container">
    <div class="header">
      <h2>🎨 Ant Design Vue 组件调试 Playground</h2>
      <div class="header-actions">
        <a-button type="primary" icon="reload" @click="refreshCode">刷新预览</a-button>
        <a-button icon="copy" @click="copyCode">复制代码</a-button>
        <a-button icon="download" @click="downloadCode">下载代码</a-button>
        <a-select v-model="currentTheme" style="width: 120px" @change="changeTheme">
          <a-select-option value="monokai">Monokai</a-select-option>
          <a-select-option value="one_dark">One Dark</a-select-option>
          <a-select-option value="github">GitHub</a-select-option>
        </a-select>
      </div>
    </div>

    <div class="tips">
      💡 <strong>使用提示：</strong> 在左侧编辑器中编写 Vue 组件代码，支持 <code><template></code>、<code><script></code>、<code><style></code> 单文件组件格式。右侧实时预览效果。
    </div>

    <!-- vue-code-view 核心组件 -->
    <Repl
      ref="repl"
      :code="code"
      :theme="currentTheme"
      :show-code="true"
      :show-preview="true"
      height="650px"
    ></Repl>
  </div>

<script>
  // 1. 全局注册 Antd 到主 Vue 实例
  Vue.use(window.antd);

  // 2. 初始化 Vue 实例
  new Vue({
    el: '#app',
    components: {
      // 正确注册 vue-code-view 组件
      Repl: window.Repl
    },
    data() {
      return {
        currentTheme: 'monokai',
        // 示例代码：展示多种 Ant Design Vue 组件
        code: `<template>
<div style="padding: 24px; background: #fafafa; min-height: 100%;">
  <a-card title="Ant Design Vue 组件示例" :bordered="false">
    <!-- 按钮组 -->
    <a-divider orientation="left">按钮 Button</a-divider>
    <a-space>
      <a-button type="primary">主按钮</a-button>
      <a-button>默认按钮</a-button>
      <a-button type="dashed">虚线按钮</a-button>
      <a-button type="danger">危险按钮</a-button>
      <a-button type="link">链接按钮</a-button>
    </a-space>

    <!-- 加载状态 -->
    <div style="margin-top: 16px;">
      <a-button type="primary" :loading="loading" @click="toggleLoading">
        {{ loading ? "加载中..." : "点击加载" }}
      </a-button>
    </div>

    <!-- 输入框 -->
    <a-divider orientation="left">输入框 Input</a-divider>
    <a-space direction="vertical" style="width: 100%;">
      <a-input v-model="inputValue" placeholder="请输入内容" style="width: 300px;" />
      <a-input-search v-model="searchValue" placeholder="搜索..." style="width: 300px;" @search="onSearch" />
      <a-textarea v-model="textareaValue" placeholder="多行文本输入" :rows="3" style="width: 300px;" />
    </a-space>

    <!-- 选择器 -->
    <a-divider orientation="left">选择器 Select</a-divider>
    <a-space>
      <a-select v-model="selectValue" style="width: 200px;" placeholder="请选择">
        <a-select-option value="option1">选项一</a-select-option>
        <a-select-option value="option2">选项二</a-select-option>
        <a-select-option value="option3">选项三</a-select-option>
      </a-select>
      <a-select v-model="multiSelectValue" mode="multiple" style="width: 200px;" placeholder="多选">
        <a-select-option value="a">A</a-select-option>
        <a-select-option value="b">B</a-select-option>
        <a-select-option value="c">C</a-select-option>
      </a-select>
    </a-space>

    <!-- 开关和复选框 -->
    <a-divider orientation="left">开关 Switch & 复选 Checkbox</a-divider>
    <a-space>
      <a-switch v-model="switchValue" checked-children="开" un-checked-children="关" />
      <a-checkbox v-model="checkboxValue">同意协议</a-checkbox>
      <a-checkbox-group v-model="checkboxGroupValue">
        <a-checkbox value="apple">苹果</a-checkbox>
        <a-checkbox value="banana">香蕉</a-checkbox>
        <a-checkbox value="orange">橙子</a-checkbox>
      </a-checkbox-group>
    </a-space>

    <!-- 消息提示 -->
    <a-divider orientation="left">消息 Message</a-divider>
    <a-space>
      <a-button @click="showMessage('success')">成功</a-button>
      <a-button @click="showMessage('info')">信息</a-button>
      <a-button @click="showMessage('warning')">警告</a-button>
      <a-button @click="showMessage('error')">错误</a-button>
    </a-space>

    <!-- 数据展示 -->
    <a-divider orientation="left">数据展示</a-divider>
    <a-descriptions title="用户信息" bordered>
      <a-descriptions-item label="用户名">{{ username }}</a-descriptions-item>
      <a-descriptions-item label="邮箱">{{ email }}</a-descriptions-item>
      <a-descriptions-item label="状态">
        <a-badge status="processing" text="运行中" />
      </a-descriptions-item>
    </a-descriptions>

    <!-- 标签页 -->
    <a-divider orientation="left">标签页 Tabs</a-divider>
    <a-tabs v-model="activeTab">
      <a-tab-pane key="1" tab="标签一">
        <p>这是标签一的内容</p>
      </a-tab-pane>
      <a-tab-pane key="2" tab="标签二">
        <p>这是标签二的内容</p>
      </a-tab-pane>
      <a-tab-pane key="3" tab="标签三">
        <p>这是标签三的内容</p>
      </a-tab-pane>
    </a-tabs>

    <!-- 进度条 -->
    <a-divider orientation="left">进度条 Progress</a-divider>
    <div style="width: 300px;">
      <a-progress :percent="progress" status="active" />
      <div style="margin-top: 10px;">
        <a-button size="small" @click="progress = 0">重置</a-button>
        <a-button size="small" @click="progress = Math.min(100, progress + 10)">增加</a-button>
      </div>
    </div>

    <!-- 通知 -->
    <a-divider orientation="left">通知 Notification</a-divider>
    <a-button type="primary" @click="openNotification">打开通知</a-button>
  </a-card>
</div>
</template>

<script>
export default {
  data() {
    return {
      loading: false,
      inputValue: '',
      searchValue: '',
      textareaValue: '',
      selectValue: undefined,
      multiSelectValue: [],
      switchValue: false,
      checkboxValue: false,
      checkboxGroupValue: [],
      username: 'Vue开发者',
      email: 'dev@example.com',
      activeTab: '1',
      progress: 30
    };
  },
  methods: {
    toggleLoading() {
      this.loading = !this.loading;
    },
    onSearch(value) {
      this.$message.info('搜索: ' + value);
    },
    showMessage(type) {
      this.$message[type]('这是一条' + type + '消息');
    },
    openNotification() {
      this.$notification.open({
        message: '通知标题',
        description: '这是一条通知的详细描述内容。',
        icon: (h) => h('a-icon', { props: { type: 'smile', theme: 'twoTone' } })
      });
    }
  }
};
</script>

<style scoped>
/* 自定义样式 */
.ant-card {
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.ant-divider {
  margin: 24px 0 16px;
}
</style>`
      };
    },
    methods: {
      // 刷新预览
      refreshCode() {
        if (this.$refs.repl) {
          this.$refs.repl.refresh();
          this.$message.success('预览已刷新！');
        }
      },
      // 复制代码
      copyCode() {
        const code = this.$refs.repl ? this.$refs.repl.code : this.code;
        navigator.clipboard.writeText(code).then(() => {
          this.$message.success('代码已复制到剪贴板！');
        }).catch(() => {
          this.$message.error('复制失败，请手动复制');
        });
      },
      // 下载代码
      downloadCode() {
        const code = this.$refs.repl ? this.$refs.repl.code : this.code;
        const blob = new Blob([code], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vue-component.vue';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.$message.success('代码已下载！');
      },
      // 切换主题
      changeTheme(theme) {
        this.$message.info('已切换主题: ' + theme);
      }
    },
    mounted() {
      // 兼容 vue-code-view 内部环境的 Antd 注册
      this.$nextTick(() => {
        try {
          const replVM = this.$refs.repl;
          if (replVM && replVM.vueInstance) {
            replVM.vueInstance.use(window.antd);
          }
          window.Vue.use(window.antd);
        } catch (e) {
          console.warn('Antd 内部注册兼容:', e.message);
        }
      });
    }
  });
</script>
</body>

</html>
